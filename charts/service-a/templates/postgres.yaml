apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "service-a.fullname" . }}-postgres
  labels:
    app: {{ include "service-a.name" . }}-postgres
spec:
  serviceName: {{ include "service-a.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "service-a.name" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "service-a.name" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-a.fullname" . }}-db
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-a.fullname" . }}-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-a.fullname" . }}-postgres
spec:
  clusterIP: None
  ports:
    - port: 5432
  selector:
    app: {{ include "service-a.name" . }}-postgres

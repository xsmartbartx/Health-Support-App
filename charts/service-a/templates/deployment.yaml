apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-a.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "service-a.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "service-a.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "service-a.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: flyway-migrate
          image: "{{ .Values.flyway.image }}"
          imagePullPolicy: IfNotPresent
          args:
            - {{ printf "-url=jdbc:postgresql://%s-postgres:5432/%s" (include "service-a.fullname" .) .Values.postgres.database | quote }}
            - "-user=$(DB_USERNAME)"
            - "-password=$(DB_PASSWORD)"
            - "-connectRetries=10"
            - "migrate"
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-a.fullname" . }}-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-a.fullname" . }}-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /flyway/sql
      containers:
        - name: service-a
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: "{{ include "service-a.fullname" . }}-postgres"
            - name: DB_PORT
              value: "5432"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ include "service-a.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-a.fullname" . }}-db
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-a.fullname" . }}-db
                  key: DB_PASSWORD
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SERVER_PORT
              value: "{{ .Values.service.port }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: migrations
          configMap:
            name: {{ include "service-a.fullname" . }}-migrations

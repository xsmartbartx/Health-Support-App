replicaCount: 1

image:
  repository: health-support-app/service-a
  pullPolicy: IfNotPresent
  tag: "local"

service:
  type: ClusterIP
  port: 8080

database:
  url: "jdbc:postgresql://postgres:5432/healthdb"
  username: "postgres"
  password: "postgres"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}

tolerations: []
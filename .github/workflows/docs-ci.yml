name: Docs CI
on:
  push:
    branches: [ "docs/readme-refactor", "main" ]
  pull_request:
    paths:
      - 'docs/**'
      - '.github/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Check Terraform format
        run: |
          set -e
          if [ -d "infra" ]; then
            find infra -type f -name "*.tf" -print0 | xargs -0 -n1 dirname | sort -u | xargs -I {} sh -c "cd {} && terraform fmt -check || exit 1"
          else
            echo "No infra folder to check"
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint charts/service-a

      - name: Secret scanning (truffleHog)
        uses: trufflesecurity/trufflehog@v3
        with:
          path: .

      - name: Markdown lint
        run: |
          # optional: run a markdown linter if installed
          echo "Markdown lint step - configure your linter"

name: CI & Docker

on:
  push:
    branches: [ 'scaffold/springboot-service', 'main' ]
  pull_request:
    branches: [ 'scaffold/springboot-service', 'main' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to GHCR
  id-token: write   # only needed for OIDC flows (not required here)

env:
  SERVICE_PATH: services/service-a
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/service-a

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run tests (service-a)
        working-directory: ${{ env.SERVICE_PATH }}
        run: ./gradlew clean test --no-daemon --stacktrace

  docker:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'  # don't push images for PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v2

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (service-a)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            JAR_FILE=/home/gradle/project/build/libs/*.jar

      - name: Output image info
        run: |
          echo "Image pushed: ${{ env.IMAGE_NAME }}:latest"
name: Docker Build & Publish
on:
  push:
    branches: [ 'scaffold/springboot-service' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ 'scaffold/springboot-service' ]

jobs:
  docker:
    name: Build, push and smoke-test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (PR validation, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./services/service-a
          push: false
          tags: health-support-app/service-a:ci

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (release tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: ./services/service-a
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/service-a:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/service-a:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose smoke test
        run: |
          docker compose up --pull always -d
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Service healthy"
              break
            fi
            echo "Waiting for service-a..."
            sleep 5
          done
          docker compose logs
          docker compose down -v

  helm-validate:
    name: Lint and render Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify JDK version pin matches Dockerfile
        run: |
          EXPECTED_MAJOR=$(grep '^java' .tool-versions | awk '{print $2}' | cut -d. -f1)
          DOCKERFILE_MAJOR=$(grep -oE 'eclipse-temurin:[0-9]+' services/service-a/Dockerfile | head -1 | grep -oE '[0-9]+')
          echo "Expected (.tool-versions): $EXPECTED_MAJOR"
          echo "Dockerfile (eclipse-temurin): $DOCKERFILE_MAJOR"
          if [ "$EXPECTED_MAJOR" != "$DOCKERFILE_MAJOR" ]; then
            echo "::error::.tool-versions JDK ($EXPECTED_MAJOR) does not match Dockerfile base image ($DOCKERFILE_MAJOR)"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/service-a

      - name: Render templates
        run: helm template charts/service-a

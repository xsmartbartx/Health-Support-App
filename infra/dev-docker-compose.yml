version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  service-a:
    build:
      context: ../services/service-a
    command: sh -c "until nc -z postgres 5432; do echo waiting for postgres; sleep 1; done; java -jar /app/app.jar"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/healthdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
